name: Windows-Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: GUI und Kommandozeilenprogramm kompilieren
        shell: cmd
        run: build.bat
      - name: Setup bauen und eingebettetes Paket prüfen
        shell: powershell
        run: .\installer\build-installer.ps1
